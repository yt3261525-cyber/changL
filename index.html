<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e0f2fe">
    <title>☁️ 长乐 API 终极导航 🎀</title>
    <style>
        :root {
            --bg-main: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 40%, #fdf2f8 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e3a8a;
            --text-sub: #64748b;
            --accent: #3b82f6;
            --border-color: rgba(255, 255, 255, 0.9);
            --shadow: 0 4px 15px -5px rgba(100, 150, 200, 0.2);
            --tag-signin-bg: #e0f2fe; --tag-signin-text: #0284c7;
            --tag-trial-bg: #fce7f3; --tag-trial-text: #db2777;
            --nav-bg: rgba(255, 255, 255, 0.95);
        }
        body[data-theme="dark"] { --bg-main: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #2e1065 100%); --card-bg: rgba(30, 41, 59, 0.85); --text-main: #f8fafc; --text-sub: #94a3b8; --accent: #818cf8; --border-color: rgba(255, 255, 255, 0.1); --tag-signin-bg: rgba(14, 165, 233, 0.2); --tag-signin-text: #38bdf8; --tag-trial-bg: rgba(236, 72, 153, 0.2); --tag-trial-text: #f472b6; --nav-bg: rgba(15, 23, 42, 0.95); }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "PingFang SC", sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; overflow-x: hidden; padding-bottom: calc(70px + env(safe-area-inset-bottom)); background-attachment: fixed; transition: background 0.3s, color 0.3s; }
        
        /* 强制清理 Netlify 广告 */
        iframe[title="Netlify"], #netlify-badge, div[style*="z-index: 999999"], div[style*="bottom: 0px"] { display: none !important; }

        /* 页面框架 */
        .page { display: none; opacity: 0; transition: opacity 0.2s; padding-bottom: 20px; }
        .page.active { display: block; opacity: 1; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; position: relative; z-index: 1; }
        
        /* 头部 */
        .header-area { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; }
        .header h1 { font-size: 24px; font-weight: 900; background: linear-gradient(to right, var(--accent), #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* 分类过滤 */
        .filter-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 15px; padding-bottom: 5px; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-sub); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; transition: all 0.2s; box-shadow: var(--shadow); }
        .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* 卡片与详情面板 */
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }
        
        .card { display: flex; flex-direction: column; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; position: relative; box-shadow: var(--shadow); transition: transform 0.2s; overflow: hidden; }
        
        .card-top { display: flex; align-items: flex-start; margin-bottom: 12px; }
        .avatar { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-right: 12px; }
        body[data-theme="dark"] .avatar { background: #334155; }
        
        .card-info { flex: 1; }
        .card-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        
        .tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 700; }
        .tag.signin { background: var(--tag-signin-bg); color: var(--tag-signin-text); }
        .tag.trial { background: var(--tag-trial-bg); color: var(--tag-trial-text); }
        .tag.none { background: #f1f5f9; color: #94a3b8; }

        /* 核心：详情复制面板 */
        .details-panel { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; border-top: 1px dashed var(--border-color); padding-top: 12px; }
        
        .detail-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); padding: 8px 12px; border-radius: 10px; font-size: 13px; border: 1px solid var(--border-color); }
        body[data-theme="dark"] .detail-item { background: rgba(0,0,0,0.2); }
        .detail-text { color: var(--text-main); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; flex: 1; }
        .detail-label { color: var(--text-sub); font-size: 11px; margin-right: 5px; font-weight: bold; }
        
        .copy-btn { background: var(--accent); color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; flex-shrink: 0; }
        .copy-btn:active { opacity: 0.7; }
        .copy-btn.outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

        /* 底部导航 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--nav-bg); backdrop-filter: blur(15px); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 900; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-sub); font-size: 10px; font-weight: bold; background: none; border: none; width: 25%; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-item.active { color: var(--accent); }

        /* 弹窗与提示 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); z-index: 3000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-box { background: var(--card-bg); border-radius: 20px; padding: 20px; width: 85%; max-width: 320px; text-align: center; color: var(--text-main); }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: var(--text-sub); }
        .form-group input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); }
        .modal-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: bold; width: 100%; margin-top: 10px; }
        
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: bold; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 4000; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>

            detailHtml += `</div>`;

            return `
            <div class="card">
                <div class="card-top">
                    <div class="avatar">${item.emoji || '🌐'}</div>
                    <div class="card-info">
                        <div class="card-title">${item.name}</div>
                        <div class="tags">${tagsHtml}</div>
                    </div>
                </div>
                ${detailHtml}
            </div>
            `;
        }

        function renderHomePage() {
            const grid = document.getElementById('homeGrid'); grid.innerHTML = '';
            let filtered = apiData.filter(item => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'both') return item.tags.some(t => t.includes('签到')) && item.tags.some(t => t.includes('试吃'));
                if (currentFilter === 'signin') return item.tags.some(t => t.includes('签到')) && !item.tags.some(t => t.includes('试吃'));
                if (currentFilter === 'trial') return item.tags.some(t => t.includes('试吃')) && !item.tags.some(t => t.includes('签到'));
                if (currentFilter === 'none') return item.tags.length === 0;
                return true;
            });
            if (filtered.length === 0) return grid.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-sub); grid-column:1/-1;">这里空空如也~</div>';
            filtered.forEach(item => grid.innerHTML += createCardHtml(item, false));
        }

        function renderMemoPage() {
            const grid = document.getElementById('memoGrid'); grid.innerHTML = '';
            if (customData.length === 0) return grid.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-sub); grid-column:1/-1;">还没有添加私有链接哦</div>';
            customData.forEach(item => {
                grid.innerHTML += `
                <div class="card">
                    <div class="card-top">
                        <div class="avatar">${item.emoji || '🌐'}</div>
                        <div class="card-info">
                            <div class="card-title">${item.name}</div>
                            <div class="tags"><span class="tag signin">私有</span></div>
                        </div>
                        <button class="copy-btn" style="background:#ef4444;" onclick="deleteMemo('${item.name}')">删除</button>
                    </div>
                    <div class="details-panel">
                        <div class="detail-item"><div class="detail-text"><span class="detail-label">注册：</span>${item.regUrl}</div><button class="copy-btn" onclick="copyText('${item.regUrl}')">复制</button></div>
                    </div>
                </div>`;
            });
        }

        // 页面切换
        window.switchPage = function(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active'); btn.classList.add('active');
            window.scrollTo(0,0);
        }

        window.copyText = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                const t = document.getElementById('toast');
                t.innerText = "✅ 已复制: " + text; t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2000);
            });
        };

        window.deleteMemo = function(name) {
            if(!confirm(`确定删除 "${name}" 吗？`)) return;
            customData = customData.filter(d => d.name !== name);
            localStorage.setItem('cl_custom', JSON.stringify(customData));
            renderMemoPage();
        };

        window.saveCustomSite = function() {
            const name = document.getElementById('addName').value.trim();
            const regUrl = document.getElementById('addUrl').value.trim();
            const emoji = document.getElementById('addEmoji').value.trim() || '🌐';
            if (!name || !regUrl) return alert("❌ 名字和注册链接不能为空！");
            customData.push({ name, regUrl, emoji, tags: [], apiUrl: '', qq: '' }); 
            localStorage.setItem('cl_custom', JSON.stringify(customData));
            document.getElementById('addModal').classList.remove('show'); 
            renderMemoPage(); 
            // 清空输入框
            document.getElementById('addName').value = '';
            document.getElementById('addUrl').value = '';
            document.getElementById('addEmoji').value = '';
        };

        window.toggleTheme = function(auto = false) {
            if(auto) { document.body.setAttribute('data-theme', 'dark'); return; }
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            if(isDark) { document.body.setAttribute('data-theme', 'blue'); document.getElementById('themeBtn').innerText = '开启'; localStorage.setItem('cl_dark', 'false'); }
            else { document.body.setAttribute('data-theme', 'dark'); document.getElementById('themeBtn').innerText = '关闭'; localStorage.setItem('cl_dark', 'true'); }
        };

        window.backupData = function() {
            const data = { custom: customData };
            navigator.clipboard.writeText(JSON.stringify(data)).then(() => alert("✅ 数据代码已复制，请妥善保存！"));
        };
        window.restoreData = function() {
            const json = prompt("请粘贴你的备份代码：");
            if(!json) return;
            try {
                const data = JSON.parse(json);
                if(data.custom) {
                    localStorage.setItem('cl_custom', JSON.stringify(data.custom));
                    alert("✅ 恢复成功，即将刷新"); setTimeout(() => location.reload(), 1000);
                }
            } catch(e) { alert("❌ 代码格式错误！"); }
        };

        init();
    </script>
</body>
</html>
